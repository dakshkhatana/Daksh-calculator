<Docktype Html>
    <html>
        <head>
            <link rel="stylesheet" href="calcs.css">
            <title>
                calculator
            </title>
        </head>
        <body>
            <input id="disp">
            <br>
            <div id="butt">
                <button id="o">1</button>
                <button id="t">2</button>
                <button id="th">3</button>
                <button id="f">4</button>
                <button id="fi">5</button>
                <button id="s">6</button>
                <button id="se">7</button>
                <button id="e">8</button>
                <button id="n">9</button>
                <button id="z">0</button>
                <button id="plus" >+</button>
                <button id="minus" >-</button>
                <button id="mult" >*</button>
                <button id="div" >/</button>
                <button id="clear" >AC</button>
                <button id="equal">=</button>
                <script src="mat.js"></script>
            </div>
        </body>
    </html>
</Docktype>
